# OpenOCD config for the STM32F407G-DISC1 board.
#
# This is compatible with all STM32F4xx cores (see target/stm32f4x.cfg).
#
# Deliberately uses the generic `interface/stlink.cfg` (libusb-based,
# auto-detects V1/V2/V2-1/V3) instead of hardcoding an hla_vid_pid: the
# classic 32F407G-DISC1 board shipped with ST-LINK/V2 (0483:3748), not the
# ST-LINK/V2-1 (0483:374b) that newer Discovery boards (e.g. F429I-DISC1)
# use, and board revisions vary.

source [find interface/stlink.cfg]

# If PW_STLINK_SERIAL is specified, use that specific probe.
if { [info exists ::env(PW_STLINK_SERIAL)] } {
  adapter serial $::env(PW_STLINK_SERIAL)
}

# If PW_GDB_PORT is specified, use that port.
if { [info exists ::env(PW_GDB_PORT)] } {
  gdb_port $::env(PW_GDB_PORT)
}

transport select hla_swd

source [find target/stm32f4x.cfg]

# Use hardware reset.
reset_config srst_only srst_nogate
